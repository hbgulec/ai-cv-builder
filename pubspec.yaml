name: ai_cv_builder
description: "A production-grade mobile AI CV Builder app with anti-hallucination resume polish, decoupled template engine, and off-thread PDF rendering."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0

  # Data & Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Networking & Storage
  dio: ^5.4.3+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  uuid: ^4.5.1
  supabase_flutter: ^2.17.2

  # PDF Engine & Graphics
  pdf: ^3.10.8
  printing: ^5.13.0
  google_fonts: ^6.2.1

  # UI Primitives & Icons
  cupertino_icons: ^1.0.6
  flutter_spinkit: ^5.2.1

  # Image Picker
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  custom_lint: ^0.6.4
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
